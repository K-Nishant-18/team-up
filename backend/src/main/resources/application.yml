server:
  port: 4000

spring:
  datasource:
    url: jdbc:h2:mem:teamup;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Comma-separated or a long secret string. Override via env APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:teamup-dev-secret-change-me-please-0123456789abcdef0123456789abcdef}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000}

logging:
  level:
    org.springframework.web: INFO
